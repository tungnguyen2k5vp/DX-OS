      tags: [Approval Governance]
      responses:
        "200":
          description: Rules, delegations and eligible delegates.
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/approval-governance/delegations:
    post:
      operationId: createApprovalDelegation
      description: Creates a date-bounded approval delegation for the manager's department.
      tags: [Approval Governance]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateApprovalDelegation" } } } }
      responses:
        "201": { description: Delegation created. }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/approval-governance/delegations/{delegationId}:
    patch:
      operationId: setApprovalDelegationActive
      description: Activates or deactivates an approval delegation using optimistic locking.
      tags: [Approval Governance]
      parameters: [{ name: delegationId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [active, expectedVersion], properties: { active: { type: boolean }, expectedVersion: { type: integer, minimum: 1 } } } } } }
      responses:
        "200": { description: Delegation status updated. }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/approval-governance/rules:
    post:
      operationId: createApprovalRule
      description: Creates a tenant approval route selected by department, currency and amount.
      tags: [Approval Governance]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SaveApprovalRule" } } } }
      responses:
        "201": { description: Approval rule created. }
  /api/v1/approval-governance/rules/{ruleId}:
    patch:
      operationId: updateApprovalRule
      description: Updates an approval route using optimistic locking.
      tags: [Approval Governance]
      parameters: [{ name: ruleId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SaveApprovalRule" } } } }
      responses:
        "200": { description: Approval rule updated. }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/sourcing:
    get:
      operationId: getSourcingBoard
      description: Lists approved requests that still require supplier comparison and ordering.
      tags: [Sourcing]
      responses:
        "200": { description: Approved requests and supplier quote comparisons. }
  /api/v1/sourcing/quotes:
    post:
      operationId: createSupplierQuote
      description: Records an idempotent supplier quote and recalculates comparison scores.
      tags: [Sourcing]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SaveSupplierQuote" } } } }
      responses:
        "201": { description: Supplier quote recorded. }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/sourcing/quotes/{quoteId}:
    patch:
      operationId: updateSupplierQuote
      description: Updates a submitted supplier quote using optimistic locking.
      tags: [Sourcing]
      parameters: [{ name: quoteId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SaveSupplierQuote" } } } }
      responses:
        "200": { description: Supplier quote updated. }
  /api/v1/sourcing/quotes/{quoteId}/selection:
    post:
      operationId: selectSupplierQuote
      description: Awards one quote and rejects alternatives in the same transaction.
      tags: [Sourcing]
      parameters:
        - { name: quoteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SelectSupplierQuote" } } } }
      responses:
        "200": { description: Quote selected and alternatives rejected atomically. }
        "409": { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Problem:
      description: Lỗi theo RFC 9457 Problem Details.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 255 }
    InvoiceId:
      name: invoiceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PurchaseRequestId:
      name: requestId
      in: path
      required: true
      description: UUID của phiếu mua sắm.
      schema:
        type: string
        format: uuid
    AttachmentId:
      name: attachmentId
      in: path
      required: true
      description: UUID metadata của tài liệu đính kèm.
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      description: Số trang, bắt đầu từ 1.
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      description: Số phần tử mỗi trang.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  schemas:
    Notification:
      type: object
      additionalProperties: false
      required: [id, eventType, resourceType, resourceId, title, body, createdAt, readAt]
      properties:
        id: { type: string, format: uuid }
        eventType: { type: string }
        resourceType: { type: string }
        resourceId: { type: string, format: uuid }
        title: { type: string }
        body: { type: string }
        createdAt: { type: string, format: date-time }
        readAt:
          anyOf:
            - { type: string, format: date-time }
            - { type: "null" }
    NotificationPage:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total, pages, unreadCount]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Notification" } }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer, format: int64 }
        pages: { type: integer }
        unreadCount: { type: integer, format: int64 }
    InvoiceBoardItem:
      type: object
      description: Dòng order/invoice; các trường invoice có thể null khi chưa ghi nhận.
      additionalProperties: true
      required: [purchaseOrderId, purchaseRequestId, requestCode, orderCode, orderStatus, orderAmount, orderCurrency, matchStatus, version, canManage]
      properties:
        purchaseOrderId: { type: string, format: uuid }
        purchaseRequestId: { type: string, format: uuid }
        requestCode: { type: string }
        orderCode: { type: string }
        orderStatus: { type: string, enum: [ORDERED, PARTIALLY_RECEIVED, RECEIPT_EXCEPTION, RECEIVED, CANCELLED] }
        orderAmount: { type: string, pattern: "^[0-9]+(\\.[0-9]{1,4})?$" }
        orderCurrency: { type: string, pattern: "^[A-Z]{3}$" }
        invoiceId:
          anyOf: [{ type: string, format: uuid }, { type: "null" }]
        invoiceNumber:
          anyOf: [{ type: string }, { type: "null" }]
        invoiceStatus:
          anyOf: [{ type: string, enum: [RECORDED, VERIFIED, DISPUTED, PAID] }, { type: "null" }]
        matchStatus: { type: string, enum: [NOT_RECORDED, WAITING_RECEIPT, CURRENCY_MISMATCH, AMOUNT_MISMATCH, PARTIAL_MATCH, MATCHED] }
        paidAmount: { type: string }
        remainingAmount: { type: string }
        paymentCount: { type: integer, minimum: 0 }
        version: { type: integer, format: int64 }
        canManage: { type: boolean }
    InvoiceBoard:
      type: object
      additionalProperties: false
      required: [items, total, awaitingInvoiceCount, needsReviewCount, readyToPayCount, overdueCount, paidCount, canManage]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/InvoiceBoardItem" } }
        total: { type: integer }
        awaitingInvoiceCount: { type: integer }
        needsReviewCount: { type: integer }
        readyToPayCount: { type: integer }
        overdueCount: { type: integer }
        paidCount: { type: integer }
        canManage: { type: boolean }
    CreateInvoice:
      type: object
      additionalProperties: false
      required: [purchaseOrderId, invoiceNumber, issuedOn, dueOn, amount, currency, note]
      properties:
        purchaseOrderId: { type: string, format: uuid }
        invoiceNumber: { type: string, minLength: 2, maxLength: 100 }
        issuedOn: { type: string, format: date }
        dueOn: { type: string, format: date }
        amount: { type: string }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        note: { type: string, maxLength: 2000 }
    UpdateInvoice:
      type: object
      additionalProperties: false
      required: [invoiceNumber, issuedOn, dueOn, amount, currency, note, expectedVersion]
      properties:
        invoiceNumber: { type: string, minLength: 2, maxLength: 100 }
        issuedOn: { type: string, format: date }
        dueOn: { type: string, format: date }
        amount: { type: string }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        note: { type: string, maxLength: 2000 }
        expectedVersion: { type: integer, format: int64, minimum: 1 }
    InvoiceTransition:
      type: object
      additionalProperties: false
      required: [action, expectedVersion]
      properties:
        action: { type: string, enum: [VERIFY, DISPUTE, REOPEN, MARK_PAID] }
        expectedVersion: { type: integer, format: int64, minimum: 1 }
        comment: { type: string, maxLength: 2000 }
        paymentReference: { type: string, maxLength: 100 }
        paidOn: { type: string, format: date }
    SlaPolicy:
      type: object
      additionalProperties: false
      required: [processName, targetHours, active, version]
      properties:
        processName: { type: string }
        targetHours: { type: integer, minimum: 1, maximum: 720 }
        active: { type: boolean }
        version: { type: integer, format: int64, minimum: 1 }
    AttachmentPolicy:
      type: object
      additionalProperties: false
      required: [id, currency, thresholdAmount, requiredDocumentType, active, version]
      properties:
        id: { type: string, format: uuid }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        thresholdAmount: { type: string }
        requiredDocumentType: { type: string, enum: [QUOTATION, SPECIFICATION, CONTRACT, OTHER] }
        active: { type: boolean }
        version: { type: integer, format: int64, minimum: 1 }
    PolicyCenter:
      type: object
      additionalProperties: false
      required: [slaPolicies, attachmentRules, canManage]
      properties:
        slaPolicies: { type: array, items: { $ref: "#/components/schemas/SlaPolicy" } }
        attachmentRules: { type: array, items: { $ref: "#/components/schemas/AttachmentPolicy" } }
        canManage: { type: boolean }
    UpdateSlaPolicy:
      type: object
      additionalProperties: false
      required: [targetHours, active, expectedVersion]
      properties:
        targetHours: { type: integer, minimum: 1, maximum: 720 }
        active: { type: boolean }
        expectedVersion: { type: integer, format: int64, minimum: 1 }
    UpdateAttachmentPolicy:
