        "200": { description: Recommendations and methodology., content: { application/json: { schema: { $ref: "#/components/schemas/AIRecommendationList" } } } }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/ai/recommendations/generate:
    post:
