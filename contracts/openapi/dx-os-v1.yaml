    SaveAuditCase:
      type: object
      required: [title, description, severity, resourceType, resourceId, ownerUserId, dueOn, status, resolution, expectedVersion]
      properties:
        title: { type: string, minLength: 3 }
        description: { type: string, minLength: 10 }
        severity: { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL] }
        resourceType: { type: string }
        resourceId: { type: string }
        ownerUserId: { type: string }
        dueOn: { type: string }
        status: { type: string, enum: [OPEN, IN_REMEDIATION, RESOLVED, CLOSED] }
        resolution: { type: string }
        expectedVersion: { type: integer, minimum: 0 }
    AdminCenter:
      type: object
      additionalProperties: true
      required: [overview, users, departments, roleNotice]
      properties:
        overview: { type: object, additionalProperties: true }
        users: { type: array, items: { type: object, additionalProperties: true } }
        departments: { type: array, items: { type: object, additionalProperties: true } }
        roleNotice: { type: string }
    UpdateAdminUser:
      type: object
      required: [displayName, email, departmentId, active, expectedVersion]
      properties:
        displayName: { type: string, minLength: 2 }
        email: { type: string }
        departmentId: { type: string, format: uuid }
        active: { type: boolean }
        expectedVersion: { type: integer, minimum: 1 }
    SaveDepartment:
      type: object
      required: [code, name, costCenter, parentId, active, expectedVersion]
      properties:
        code: { type: string, minLength: 2, maxLength: 50 }
        name: { type: string, minLength: 2, maxLength: 255 }
        costCenter: { type: string }
        parentId: { type: string }
        active: { type: boolean }
        expectedVersion: { type: integer, minimum: 0 }
    AIAssistantStatus:
      type: object
      additionalProperties: false
      required: [enabled, available, provider, model, knowledgeDocuments, message]
      properties:
        enabled: { type: boolean }
        available: { type: boolean }
        provider: { type: string, enum: [ollama-local] }
        model: { type: string }
        knowledgeDocuments: { type: integer, minimum: 0 }
        message: { type: string }
    AIAssistantQuestion:
      type: object
      additionalProperties: false
      required: [question]
      properties:
        question: { type: string, minLength: 3, maxLength: 1000 }
    AIAssistantSource:
      type: object
      additionalProperties: false
      required: [index, title, path, excerpt]
      properties:
        index: { type: integer, minimum: 1 }
        title: { type: string }
        path: { type: string }
        excerpt: { type: string }
    AIAssistantAnswer:
      type: object
      additionalProperties: false
      required: [answer, sources, model, durationMs, generatedAt, groundedOnly]
      properties:
        answer: { type: string }
        sources: { type: array, minItems: 1, maxItems: 5, items: { $ref: "#/components/schemas/AIAssistantSource" } }
        model: { type: string }
        durationMs: { type: integer, format: int64, minimum: 0 }
        generatedAt: { type: string, format: date-time }
        groundedOnly: { type: boolean, const: true }
    AIRecommendationList:
      type: object
      additionalProperties: true
      required: [items, total, pending, highRisk, canOperate, methodology]
      properties:
        items: { type: array, items: { type: object, additionalProperties: true } }
        total: { type: integer }
        pending: { type: integer }
        highRisk: { type: integer }
        canOperate: { type: boolean }
        methodology: { type: string }
    AIDecision:
      type: object
      required: [status, comment, expectedVersion]
      properties:
        status: { type: string, enum: [APPROVED, REJECTED, DISMISSED] }
        comment: { type: string, minLength: 5, maxLength: 2000 }
        expectedVersion: { type: integer, minimum: 1 }
    ProcurementCatalog:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, code, name, description, category, unit, referenceUnitPrice, currency]
            properties:
              id: { type: string, format: uuid }
              code: { type: string }
              name: { type: string }
              description: { type: string }
              category: { type: string }
              unit: { type: string }
              referenceUnitPrice: { type: string }
              currency: { type: string, minLength: 3, maxLength: 3 }
        total: { type: integer }
    DuplicateCheck:
      type: object
      required: [title, costCenter, totalAmount, excludeRequestId]
      properties:
        title: { type: string, minLength: 3, maxLength: 255 }
        costCenter: { type: string }
        totalAmount: { type: string }
        excludeRequestId: { type: string }
    CreateApprovalDelegation:
      type: object
      required: [delegateUserId, startsOn, endsOn, reason]
      properties:
        delegateUserId: { type: string, format: uuid }
        startsOn: { type: string, format: date }
        endsOn: { type: string, format: date }
        reason: { type: string, minLength: 10, maxLength: 1000 }
    SaveApprovalRule:
      type: object
      required: [departmentId, name, currency, minimumAmount, maximumAmount, requiresManager, requiresFinance, priority, active, expectedVersion]
      properties:
        departmentId: { type: string }
        name: { type: string, minLength: 3, maxLength: 255 }
        currency: { type: string, minLength: 3, maxLength: 3 }
        minimumAmount: { type: string }
        maximumAmount: { type: string }
        requiresManager: { type: boolean }
        requiresFinance: { type: boolean }
        priority: { type: integer, minimum: 0 }
        active: { type: boolean }
        expectedVersion: { type: integer, minimum: 0 }
    SaveSupplierQuote:
      type: object
      required: [purchaseRequestId, supplierId, quoteReference, amount, currency, deliveryOn, warrantyMonths, paymentTerms, note, expectedVersion]
      properties:
        purchaseRequestId: { type: string }
        supplierId: { type: string }
        quoteReference: { type: string, minLength: 2, maxLength: 100 }
        amount: { type: string }
        currency: { type: string, minLength: 3, maxLength: 3 }
        deliveryOn: { type: string, format: date }
        warrantyMonths: { type: integer, minimum: 0, maximum: 240 }
        paymentTerms: { type: string, minLength: 3, maxLength: 500 }
        note: { type: string, maxLength: 2000 }
        expectedVersion: { type: integer, minimum: 0 }
    SelectSupplierQuote:
      type: object
      required: [expectedCaseVersion, expectedQuoteVersion, comment]
      properties:
        expectedCaseVersion: { type: integer, minimum: 1 }
        expectedQuoteVersion: { type: integer, minimum: 1 }
        comment: { type: string, minLength: 10, maxLength: 2000 }
    FieldViolation:
      type: object
      additionalProperties: false
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, detail, instance, code, correlationId]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
        correlationId:
          type: string
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldViolation"
security:
  - bearerAuth: []
