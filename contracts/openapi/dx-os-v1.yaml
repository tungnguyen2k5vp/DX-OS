openapi: 3.1.0
info:
  title: DX-OS API
  version: 1.0.0
  description: Contract cho API mua sắm, giao nhận, công nợ, kiểm toán, quản trị và khuyến nghị của DX-OS.
  contact:
    name: DX-OS Engineering
    url: https://docs.dx-os.local
servers:
  - url: http://localhost:8081
    description: Local Docker Compose
tags:
  - name: Health
  - name: Identity
  - name: Procurement
  - name: Budgets
  - name: Documents
  - name: Reports
  - name: Notifications
  - name: Invoices
  - name: Policies
  - name: Suppliers
  - name: Fulfillment
  - name: Audit
  - name: Administration
  - name: AI
  - name: Catalog
  - name: Approval Governance
  - name: Sourcing
paths:
  /health/live:
    get:
      operationId: getLiveness
      description: Xác nhận process API đang chạy mà không kiểm tra dependency bên ngoài.
      tags: [Health]
      security: []
      responses:
        "200":
          description: Process đang chạy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /health/ready:
    get:
      operationId: getReadiness
      description: Xác nhận API và PostgreSQL đã sẵn sàng nhận request.
      tags: [Health]
      security: []
      responses:
        "200":
          description: Dependency bắt buộc sẵn sàng.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          $ref: "#/components/responses/Problem"
  /api/v1/me:
    get:
      operationId: getCurrentUser
      description: Trả danh tính và realm role đã xác minh từ bearer access token.
      tags: [Identity]
      responses:
        "200":
          description: Principal được suy ra từ access token hợp lệ.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Problem"
  /api/v1/purchase-requests:
    post:
      operationId: createPurchaseRequest
      description: Tạo phiếu mua sắm DRAFT cho user và phòng ban lấy từ access token/profile nghiệp vụ.
      tags: [Procurement]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePurchaseRequest"
      responses:
        "201":
          description: Phiếu mua sắm đã được tạo.
          headers:
            Location:
              description: URI của phiếu vừa tạo.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseRequest"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
    get:
      operationId: listPurchaseRequests
      description: Liệt kê phiếu theo scope của user, có phân trang và lọc trạng thái.
      tags: [Procurement]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: status
          in: query
          description: Lọc theo trạng thái workflow.
          schema:
            $ref: "#/components/schemas/PurchaseRequestStatus"
      responses:
        "200":
          description: Trang kết quả trong scope được phép.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseRequestPage"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /api/v1/purchase-requests/{requestId}:
    get:
      operationId: getPurchaseRequest
      description: Trả chi tiết phiếu và các dòng hàng nếu phiếu thuộc data scope của user.
      tags: [Procurement]
      parameters:
        - name: requestId
          in: path
          required: true
          description: UUID của phiếu mua sắm.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Chi tiết phiếu mua sắm.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseRequest"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updatePurchaseRequest
      description: Cập nhật nội dung phiếu DRAFT hoặc CHANGES_REQUESTED do chính user tạo, có optimistic locking.
      tags: [Procurement]
      parameters:
        - name: requestId
          in: path
          required: true
          description: UUID của phiếu mua sắm.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePurchaseRequest"
      responses:
        "200":
          description: Phiếu đã được cập nhật và tăng version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseRequest"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /api/v1/purchase-requests/{requestId}/transitions:
    post:
      operationId: transitionPurchaseRequest
      description: Thực hiện một hành động workflow theo role, data scope và trạng thái hiện tại.
      tags: [Procurement]
      parameters:
        - name: requestId
          in: path
          required: true
          description: UUID của phiếu mua sắm.
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          description: Khóa duy nhất cho một ý định transition; gửi lại cùng khóa sẽ nhận cùng kết quả.
          schema:
            type: string
            minLength: 8
            maxLength: 255
            pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{7,254}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransitionPurchaseRequest"
      responses:
        "200":
          description: Transition đã được áp dụng hoặc phát lại an toàn từ cùng Idempotency-Key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseRequest"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /api/v1/purchase-requests/{requestId}/timeline:
    get:
      operationId: getPurchaseRequestTimeline
      description: Trả lịch sử nghiệp vụ append-only nếu phiếu thuộc data scope của user.
      tags: [Procurement]
      parameters:
        - name: requestId
          in: path
          required: true
          description: UUID của phiếu mua sắm.
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Trang timeline mới nhất trước; không chứa metadata hoặc idempotency key nội bộ.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseRequestTimelinePage"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /api/v1/purchase-requests/{requestId}/attachments:
    get:
      operationId: listPurchaseRequestAttachments
      description: Liệt kê metadata tài liệu và quy tắc bắt buộc theo cùng data scope với phiếu.
      tags: [Documents]
      parameters:
        - $ref: "#/components/parameters/PurchaseRequestId"
      responses:
        "200":
          description: Danh sách tài liệu đang hoạt động và kết quả kiểm tra quy tắc.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseRequestAttachmentList"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    post:
      operationId: uploadPurchaseRequestAttachment
      description: Chủ phiếu tải tài liệu lên khi phiếu còn cho phép chỉnh sửa.
      tags: [Documents]
      parameters:
        - $ref: "#/components/parameters/PurchaseRequestId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [documentType, file]
              properties:
                documentType:
                  $ref: "#/components/schemas/AttachmentDocumentType"
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Tệp và metadata đã được lưu thành công.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseRequestAttachment"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /api/v1/purchase-requests/{requestId}/attachments/{attachmentId}:
    delete:
      operationId: deletePurchaseRequestAttachment
      description: Chủ phiếu xóa tài liệu khi phiếu còn DRAFT hoặc CHANGES_REQUESTED.
      tags: [Documents]
      parameters:
        - $ref: "#/components/parameters/PurchaseRequestId"
        - $ref: "#/components/parameters/AttachmentId"
      responses:
        "204":
          description: Tệp đã được xóa khỏi kho và metadata được đánh dấu DELETED.
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /api/v1/purchase-requests/{requestId}/attachments/{attachmentId}/content:
    get:
      operationId: downloadPurchaseRequestAttachment
      description: Tải nội dung sau khi backend kiểm tra data scope và checksum SHA-256.
      tags: [Documents]
      parameters:
        - $ref: "#/components/parameters/PurchaseRequestId"
        - $ref: "#/components/parameters/AttachmentId"
      responses:
        "200":
          description: Nội dung tệp.
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /api/v1/purchase-requests/{requestId}/budget-check:
    get:
      operationId: checkPurchaseRequestBudget
      description: Returns the active allocation and reservation result for a purchase request in the caller's data scope.
      tags: [Budgets]
      parameters:
        - name: requestId
          in: path
          required: true
          description: Purchase request UUID.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Budget availability or reservation state for the purchase request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetCheck"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /api/v1/budgets/summary:
    get:
      operationId: getBudgetSummary
      description: Returns an active budget allocation. Finance and audit can inspect their organization; managers are limited to their department cost center.
      tags: [Budgets]
      parameters:
        - name: costCenter
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: currency
          in: query
          required: true
          schema:
            type: string
            pattern: "^[A-Z]{3}$"
      responses:
        "200":
          description: Active allocation totals after reservations and commitments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetSummary"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /api/v1/budgets/dashboard:
    get:
      operationId: getBudgetDashboard
      description: Returns active allocations, currency totals, reservations and adjustment history for finance or audit in the caller's organization.
      tags: [Budgets]
      responses:
        "200":
          description: Organization-scoped budget management dashboard.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetDashboard"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /api/v1/budgets/allocations/{allocationId}:
    patch:
      operationId: adjustBudgetAllocation
      description: Adjusts the total allocation. Finance only; audit remains read-only.
      tags: [Budgets]
      parameters:
        - name: allocationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 255
            pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{7,254}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdjustBudgetAllocation"
      responses:
        "200":
          description: Updated allocation or an idempotent replay of the adjustment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetAllocation"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /api/v1/reports/procurement:
    get:
      operationId: getProcurementReport
      description: Trả dashboard vận hành từ curated reporting views. Chỉ finance, auditor và dx_admin được truy cập.
      tags: [Reports]
      parameters:
        - name: from
          in: query
          description: Ngày bắt đầu, mặc định là 29 ngày trước ngày hiện tại.
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: Ngày kết thúc, mặc định là ngày hiện tại. Khoảng thời gian tối đa 367 ngày.
          schema:
            type: string
            format: date
        - name: departmentId
          in: query
          description: UUID phòng ban.
          schema:
            type: string
            format: uuid
        - name: costCenter
          in: query
          description: Cost center chuẩn hóa thành chữ hoa.
          schema:
            type: string
            minLength: 2
            maxLength: 100
            pattern: "^[A-Z0-9][A-Z0-9._-]{1,99}$"
        - name: currency
          in: query
          description: Mã tiền tệ ISO dạng ba chữ cái.
          schema:
            type: string
            pattern: "^[A-Z]{3}$"
      responses:
        "200":
          description: KPI, xu hướng, phân bố trạng thái, phòng ban và sử dụng ngân sách theo bộ lọc.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcurementReportDashboard"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /api/v1/me/notifications:
    get:
      operationId: listMyNotifications
      description: Liệt kê notification đã materialize theo principal hiện tại và trạng thái đã đọc.
      tags: [Notifications]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: unreadOnly
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Notification theo đúng user/role/department scope.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationPage" }
        "401": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /api/v1/me/notifications/read-all:
    post:
      operationId: markAllMyNotificationsRead
      description: Đánh dấu toàn bộ notification thuộc principal hiện tại là đã đọc.
      tags: [Notifications]
      responses:
        "200":
          description: Số notification vừa đánh dấu đã đọc.
          content:
            application/json:
              schema:
                type: object
                required: [updated]
                properties: { updated: { type: integer, format: int64 } }
        "401": { $ref: "#/components/responses/Problem" }
  /api/v1/me/notifications/{notificationId}/read:
    post:
      operationId: markMyNotificationRead
      description: Đánh dấu một notification thuộc principal hiện tại là đã đọc.
      tags: [Notifications]
      parameters:
        - name: notificationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Đã đánh dấu đọc hoặc trước đó đã đọc. }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/invoices:
    get:
      operationId: getInvoiceBoard
      description: Trả hàng đợi hóa đơn và kết quả đối soát động cho Finance hoặc Auditor.
      tags: [Invoices]
      responses:
        "200":
          description: Hàng đợi đối soát/công nợ theo organization.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvoiceBoard" }
        "403": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createInvoice
      description: Finance ghi một hóa đơn duy nhất cho purchase order trong organization.
      tags: [Invoices]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateInvoice" }
      responses:
        "201":
          description: Hóa đơn được ghi nhận.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvoiceBoardItem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/invoices/{invoiceId}:
    patch:
      operationId: updateInvoice
      description: Finance sửa hóa đơn chưa hoàn tất bằng optimistic locking.
      tags: [Invoices]
      parameters:
        - $ref: "#/components/parameters/InvoiceId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateInvoice" }
      responses:
        "200":
          description: Hóa đơn đã cập nhật.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvoiceBoardItem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/invoices/{invoiceId}/transitions:
    post:
      operationId: transitionInvoice
      description: Finance xác minh, tranh chấp, mở lại hoặc ghi nhận thanh toán hóa đơn.
      tags: [Invoices]
      parameters:
        - $ref: "#/components/parameters/InvoiceId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvoiceTransition" }
      responses:
        "200":
          description: Hóa đơn sau transition.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvoiceBoardItem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/admin/policies:
    get:
      operationId: getPolicyCenter
      description: Trả SLA và quy tắc chứng từ; Auditor luôn nhận chế độ chỉ đọc.
      tags: [Policies]
      responses:
        "200":
          description: SLA và quy tắc chứng từ; auditor nhận canManage=false.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyCenter" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/admin/policies/sla/{processName}:
    patch:
      operationId: updateSlaPolicy
      description: DX Admin cập nhật SLA theo process với optimistic locking và audit.
      tags: [Policies]
      parameters:
        - name: processName
          in: path
          required: true
          schema: { type: string, maxLength: 80 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateSlaPolicy" }
