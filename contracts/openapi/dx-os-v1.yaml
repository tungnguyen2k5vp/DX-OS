      tags: [Catalog]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/DuplicateCheck" } } } }
      responses:
        "200": { description: Similar recent requests. }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/approval-governance:
    get:
      operationId: getApprovalGovernance
