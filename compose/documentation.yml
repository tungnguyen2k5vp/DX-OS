services:
  docs:
    profiles: ["documentation"]
    build:
      context: ..
      dockerfile: docs-site/Dockerfile
      args:
        NODE_BUILDER_IMAGE: ${NODE_BUILDER_IMAGE}
        NGINX_IMAGE: ${NGINX_IMAGE}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DOCS_HOST_PORT}:80"
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
