services:
  ollama:
    profiles: ["application"]
    image: ${OLLAMA_IMAGE}
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: 5m
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 15s
    networks:
      - dxos_internal

  ollama-init:
    profiles: ["application"]
    image: ${OLLAMA_IMAGE}
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/ollama"]
    command: ["pull", "${OLLAMA_CHAT_MODEL}"]
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - dxos_internal

volumes:
  ollama_data:
