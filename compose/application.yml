services:
  nextcloud:
    profiles: ["application"]
    image: ${NEXTCLOUD_IMAGE}
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${NEXTCLOUD_DB}
      POSTGRES_USER: ${NEXTCLOUD_DB_USER}
      POSTGRES_PASSWORD: ${NEXTCLOUD_DB_PASSWORD}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: localhost nextcloud
    ports:
      - "127.0.0.1:${NEXTCLOUD_HOST_PORT}:80"
    volumes:
      - nextcloud_data:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "php -r '$$body = @file_get_contents(\"http://127.0.0.1/status.php\"); if ($$body === false) { exit(1); }'",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    networks:
      - dxos_internal

  migrate:
    profiles: ["application"]
    build:
      context: ../backend
      args:
        GO_BUILDER_IMAGE: ${GO_BUILDER_IMAGE}
    entrypoint: ["/app/migrate"]
    environment:
      DATABASE_URL: postgresql://${DXOS_DB_USER}:${DXOS_DB_PASSWORD}@postgres:5432/${DXOS_DB}?sslmode=disable
      MIGRATIONS_PATH: /app/migrations
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dxos_internal
    restart: "no"

  reporting-bootstrap:
    profiles: ["reporting"]
    image: ${POSTGRES_IMAGE}
    restart: "no"
    environment:
      PGPASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_ADMIN_USER: ${POSTGRES_ADMIN_USER}
      DXOS_DB: ${DXOS_DB}
      DXOS_DB_USER: ${DXOS_DB_USER}
      REPORTING_DB_USER: ${REPORTING_DB_USER}
      REPORTING_DB_PASSWORD: ${REPORTING_DB_PASSWORD}
    entrypoint: ["/bin/sh", "/reporting/bootstrap-reporting-role.sh"]
    volumes:
      - ../data/postgres/reporting:/reporting:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - dxos_internal

  metabase:
    profiles: ["reporting"]
    image: ${METABASE_IMAGE}
    restart: unless-stopped
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: postgres
      MB_DB_PORT: "5432"
      MB_DB_DBNAME: ${METABASE_DB}
      MB_DB_USER: ${METABASE_DB_USER}
      MB_DB_PASS: ${METABASE_DB_PASSWORD}
      MB_ENCRYPTION_SECRET_KEY: ${METABASE_ENCRYPTION_SECRET_KEY}
      MB_SITE_NAME: DX-OS Analytics
      MB_SITE_URL: http://localhost:${METABASE_HOST_PORT}
      JAVA_TIMEZONE: Asia/Bangkok
    ports:
      - "127.0.0.1:${METABASE_HOST_PORT}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      reporting-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:3000/api/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 120s
    networks:
      - dxos_internal

  api:
    profiles: ["application"]
    build:
      context: ../backend
      args:
        GO_BUILDER_IMAGE: ${GO_BUILDER_IMAGE}
    restart: unless-stopped
    environment:
      APP_ENV: development
      HTTP_ADDRESS: :8081
      DATABASE_URL: postgresql://${DXOS_DB_USER}:${DXOS_DB_PASSWORD}@postgres:5432/${DXOS_DB}?sslmode=disable
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_JWKS_URL: http://keycloak:8080/realms/dx-os/protocol/openid-connect/certs
      OIDC_API_AUDIENCE: ${OIDC_API_AUDIENCE}
      CORS_ALLOWED_ORIGIN: http://localhost:${WEB_HOST_PORT}
      NEXTCLOUD_URL: http://nextcloud
      NEXTCLOUD_USERNAME: ${NEXTCLOUD_ADMIN_USER}
      NEXTCLOUD_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      NEXTCLOUD_ROOT: ${NEXTCLOUD_ROOT}
    ports:
      - "127.0.0.1:${API_HOST_PORT}:8081"
    depends_on:
      migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_started
      nextcloud:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/health/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - dxos_internal

  worker:
    profiles: ["application"]
    build:
      context: ../backend
      args:
        GO_BUILDER_IMAGE: ${GO_BUILDER_IMAGE}
    entrypoint: ["/app/worker"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${DXOS_DB_USER}:${DXOS_DB_PASSWORD}@postgres:5432/${DXOS_DB}?sslmode=disable
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - dxos_internal

  web:
    profiles: ["application"]
    build:
      context: ../frontend
      args:
        NODE_BUILDER_IMAGE: ${NODE_BUILDER_IMAGE}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_HOST_PORT}:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - dxos_internal

volumes:
  nextcloud_data:
